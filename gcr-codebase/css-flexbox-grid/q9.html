<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Flip</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="card-container">

        <div class="card">

            <!-- Front Side -->
            <div class="card-front">

                <img src="https://picsum.photos/id/237/300/200"
                     alt="Nature">

                <h2>Nature</h2>

            </div>

            <!-- Back Side -->
            <div class="card-back">

                <h2>About Nature</h2>

                <p>
                    Nature provides beautiful landscapes,
                    fresh air and a peaceful environment.
                </p>

            </div>

        </div>

    </div>

</body>
</html>
