<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Photo Gallery</h1>

    <div class="gallery">

        <figure>
            <img src="https://picsum.photos/id/10/400/300"

        </figure>

            <img src="https://picsum.photos/id/15/400/300"

        <figure>

                 alt="Forest">

        </figure>

        <figure>
            <img src="https://picsum.photos/id/37/400/300"
                 alt="Beach">
            <figcaption>Beautiful Beach</figcaption>
        </figure>

        <figure>
            <img src="https://picsum.photos/id/48/400/300"
                 alt="City">
            <figcaption>City View</figcaption>
        </figure>

        <figure>
            <img src="https://picsum.photos/id/55/400/300"
                 alt="Lake">
            <figcaption>Peaceful Lake</figcaption>
        </figure>

    </div>

</body>
</html>
