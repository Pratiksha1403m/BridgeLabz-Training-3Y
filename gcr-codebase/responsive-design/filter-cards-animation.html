<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filter Cards Animation</title>
    <link rel="stylesheet" href="filter-cards-animation.css">
</head>
<body>

<header>
    <h1>Profile Cards</h1>
</header>

<main>
    <section class="profiles">

        <article class="profile-card">
            <img class="gray" src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=500&q=80" alt="Profile of a woman">
            <h2>Alex</h2>
            <p>UI Designer</p>
        </article>

        <article class="profile-card">
            <img class="sepia" src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=500&q=80" alt="Profile of a man">
            <h2>John</h2>
            <p>Developer</p>
        </article>

        <article class="profile-card">
            <img class="gray" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=500&q=80" alt="Profile of a woman">
            <h2>Emma</h2>
            <p>Project Manager</p>
        </article>

    </section>
</main>

<footer>
    <p>Profile Section</p>
</footer>

</body>
</html>
