<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filter Comparison</title>
    <link rel="stylesheet" href="filter-comparison-layout.css">
</head>
<body>

<header>
    <h1>Filter Comparison</h1>
</header>

<main>
    <section class="comparison">

        <figure>
            <img src="https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=700&q=80" alt="Original mountain image">
            <figcaption>Before - Original Image</figcaption>
        </figure>

        <figure>
            <img class="filtered" src="https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=700&q=80" alt="Filtered mountain image">
            <figcaption>After - Filtered Image</figcaption>
        </figure>

    </section>
</main>

<footer>
    <p>CSS Filter Comparison</p>
</footer>

</body>
</html>
