<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>My Dashboard</h1>
</header>

<div class="dashboard">

    <aside>
        <nav>
            <a href="#">Dashboard</a>
            <a href="#">Profile</a>
            <a href="#">Projects</a>
            <a href="#">Settings</a>
        </nav>
    </aside>

    <main>

        <section class="box">
            <h2>Welcome</h2>
            <p>
                Welcome to your dashboard. Here you can manage your projects
                and profile.
            </p>
        </section>

        <section class="box">
            <h2>Projects</h2>
            <p>
                You currently have 5 active projects.
            </p>
        </section>

        <section class="box">
            <h2>Statistics</h2>
            <p>
                Your projects have received 250 views this month.
            </p>
        </section>

    </main>

</div>

</body>
</html>
