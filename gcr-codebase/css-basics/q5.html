<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pricing Plans</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1 class="title">Choose Your Plan</h1>

<main class="pricing">

    <div class="plan">
        <h2>Basic</h2>
        <div class="price">₹199/month</div>

        <ul>
            <li>5 Projects</li>
            <li>5 GB Storage</li>
            <li>Email Support</li>
        </ul>

        <a href="#">Choose Plan</a>
    </div>

    <div class="plan popular">
        <h2>Standard</h2>
        <div class="price">₹499/month</div>

        <ul>
            <li>15 Projects</li>
            <li>20 GB Storage</li>
            <li>Priority Support</li>
        </ul>

        <a href="#">Choose Plan</a>
    </div>

    <div class="plan">
        <h2>Premium</h2>
        <div class="price">₹999/month</div>

        <ul>
            <li>Unlimited Projects</li>
            <li>100 GB Storage</li>
            <li>24/7 Support</li>
        </ul>

        <a href="#">Choose Plan</a>
    </div>

</main>

</body>
</html>
