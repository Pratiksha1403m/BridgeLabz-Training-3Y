<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Portfolio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="q2.css">
</head>
<body>

<header class="bg-light text-dark text-center p-5">
    <div class="container">
        <h1 class="fw-bold">Anshika Singh</h1>
        <p class="lead">Web Developer | Cloud & DevOps Enthusiast</p>
    </div>
</header>

<main>
    <section class="container text-center py-5">

        <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=500&q=80"
             class="img-fluid rounded-circle profile-img mb-4"
             alt="Profile">

        <h2 class="fw-bold">Hello, I'm Anshika</h2>

        <p class="text-muted mx-auto profile-text">
            I enjoy building clean, responsive and user-friendly digital experiences.
            I am passionate about technology, development and learning new tools.
        </p>

        <div class="mb-4">
            <button class="btn btn-primary me-2">Hire Me</button>
            <button class="btn btn-outline-dark">Download CV</button>
        </div>

        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                <form class="bg-light p-5 rounded">
                    <h3 class="fw-bold mb-4">Contact Me</h3>

                    <input type="text" class="form-control mb-3" placeholder="Your Name">

                    <input type="email" class="form-control mb-3" placeholder="Email Address">

                    <textarea class="form-control mb-3" rows="4" placeholder="Your Message"></textarea>

                    <button type="submit" class="btn btn-primary w-100">Send Message</button>
                </form>
            </div>
        </div>

    </section>
</main>

<footer class="bg-dark text-white text-center p-4">
    <p class="mb-0">© 2026 Anshika Singh. All Rights Reserved.</p>
</footer>

</body>
</html>
