<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Catalog</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="q3.css">
</head>
<body>

<header class="bg-dark text-white py-4">
    <div class="container text-center">
        <h1 class="fw-bold">TechStore</h1>
        <p class="mb-0">Quality products at great prices</p>
    </div>
</header>

<main>
    <section class="container py-5">
        <h2 class="text-center fw-bold mb-5">Featured Products</h2>

        <div class="row g-4">

            <div class="col-12 col-sm-6 col-md-3">
                <div class="card product-card h-100">
                    <img src="https://images.unsplash.com/photo-1541807084-5c52b6b3adef?auto=format&fit=crop&w=600&q=80" class="card-img-top" alt="Laptop">
                    <div class="card-body">
                        <h5 class="card-title">Laptop Pro</h5>
                        <p class="text-primary fw-bold">₹65,999</p>
                        <button class="btn btn-primary w-100">Add to Cart</button>
                    </div>
                </div>
            </div>

            <div class="col-12 col-sm-6 col-md-3">
                <div class="card product-card h-100">
                    <img src="https://images.unsplash.com/photo-1546435770-a3e426bf472b?auto=format&fit=crop&w=600&q=80" class="card-img-top" alt="Headphones">
                    <div class="card-body">
                        <h5 class="card-title">Wireless Headphones</h5>
                        <p class="text-primary fw-bold">₹4,999</p>
                        <button class="btn btn-primary w-100">Add to Cart</button>
                    </div>
                </div>
            </div>

            <div class="col-12 col-sm-6 col-md-3">
                <div class="card product-card h-100">
                    <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=600&q=80" class="card-img-top" alt="Smart Watch">
                    <div class="card-body">
                        <h5 class="card-title">Smart Watch</h5>
                        <p class="text-primary fw-bold">₹3,499</p>
                        <button class="btn btn-primary w-100">Add to Cart</button>
                    </div>
                </div>
            </div>

            <div class="col-12 col-sm-6 col-md-3">
                <div class="card product-card h-100">
                    <img src="https://images.unsplash.com/photo-1609592424959-5f8d7e9b3d4a?auto=format&fit=crop&w=600&q=80" class="card-img-top" alt="Camera">
                    <div class="card-body">
                        <h5 class="card-title">Digital Camera</h5>
                        <p class="text-primary fw-bold">₹42,999</p>
                        <button class="btn btn-primary w-100">Add to Cart</button>
                    </div>
                </div>
            </div>

        </div>
    </section>
</main>

<footer class="bg-dark text-white text-center py-4">
    <p class="mb-0">© 2026 TechStore</p>
</footer>

</body>
</html>
