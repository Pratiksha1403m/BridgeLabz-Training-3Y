<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Animation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>CSS Animation Demonstration</h1>
    </header>

    <main>

        <section class="animations">

            <!-- Moving box -->
            <div class="animation-box moving-box">
                Moving
            </div>

            <!-- Bouncing ball -->
            <div class="animation-box bouncing-ball">
                Ball
            </div>

            <!-- Color changing text -->
            <h2 class="changing-text">
                Color Changing Text
            </h2>

        </section>

    </main>

    <footer>
        <p>CSS Animation Practice</p>
    </footer>

</body>
</html>
