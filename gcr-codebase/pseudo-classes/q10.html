<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini User Interface</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header -->
    <header>
        <h1>My Mini UI</h1>
    </header>

    <main>

        <!-- Main UI Card -->
        <section class="card">

            <!-- Image -->
            <div class="image-section">

                <img
                    src="https://images.unsplash.com/photo-1498050108023-c5249f4df085"
                    alt="Laptop on desk"
                >

            </div>

            <!-- Card Content -->
            <div class="content">

                <h2>Welcome!</h2>

                <p>
                    This is a simple responsive user interface
                    created using HTML and CSS.
                </p>

                <!-- Form -->
                <form>

                    <label for="name">
                        Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your name"
                    >

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                    >

                    <!-- Buttons -->
                    <div class="buttons">

                        <button type="submit">
                            Submit
                        </button>

                        <button type="reset">
                            Reset
                        </button>

                    </div>

                </form>

            </div>

        </section>

    </main>

    <!-- Footer -->
    <footer>
        <p>© 2026 Mini UI Practice</p>
    </footer>

</body>
</html>
