<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Showcase</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Image Showcase</h1>
        <p>Hover over the images to see the effects</p>
    </header>

    <main>

        <section class="gallery">

            <!-- Image 1 -->
            <figure>
                <div class="image-container">
                    <img
                        src="https://images.unsplash.com/photo-1506744038136-46273834b3fb"
                        alt="Mountain landscape"
                    >
                </div>

                <figcaption>Mountain Landscape</figcaption>
            </figure>

            <!-- Image 2 -->
            <figure>
                <div class="image-container">
                    <img
                        src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e"
                        alt="Nature landscape"
                    >
                </div>

                <figcaption>Beautiful Nature</figcaption>
            </figure>

            <!-- Image 3 -->
            <figure>
                <div class="image-container">
                    <img
                        src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e"
                        alt="Green forest"
                    >
                </div>

                <figcaption>Green Forest</figcaption>
            </figure>

            <!-- Image 4 -->
            <figure>
                <div class="image-container">
                    <img
                        src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e"
                        alt="Beach"
                    >
                </div>

                <figcaption>Peaceful Beach</figcaption>
            </figure>

            <!-- Image 5 -->
            <figure>
                <div class="image-container">
                    <img
                        src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b"
                        alt="Mountain scenery"
                    >
                </div>

                <figcaption>Mountain Scenery</figcaption>
            </figure>

            <!-- Image 6 -->
            <figure>
                <div class="image-container">
                    <img
                        src="https://images.unsplash.com/photo-1472214103451-9374bd1c798e"
                        alt="Green valley"
                    >
                </div>

                <figcaption>Green Valley</figcaption>
            </figure>

        </section>

    </main>

    <footer>
        <p>Image Showcase Practice</p>
    </footer>

</body>
</html>
