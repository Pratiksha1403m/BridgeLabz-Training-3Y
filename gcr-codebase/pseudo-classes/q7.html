<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Interface Components</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main>

        <section class="ui-card">

            <h1>Simple User Interface</h1>

            <!-- Search bar -->
            <input
                type="search"
                class="search"
                placeholder="Search here..."
            >

            <!-- Dropdown -->
            <select>
                <option>Select Category</option>
                <option>HTML</option>
                <option>CSS</option>
                <option>Java</option>
                <option>Python</option>
            </select>

            <!-- Buttons -->
            <div class="button-group">

                <button>
                    Search
                </button>

                <button>
                    Reset
                </button>

            </div>

        </section>

    </main>

</body>
</html>
