<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tooltip Demonstration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>CSS Tooltip Demonstration</h1>
        <p>Hover over each word to see the tooltip</p>
    </header>

    <main>
        <section class="tooltip-container">

            <!-- Tooltip 1 -->
            <div class="tooltip-box">
                HTML

                <span class="tooltip">
                    HyperText Markup Language
                </span>
            </div>

            <!-- Tooltip 2 -->
            <div class="tooltip-box">
                CSS

                <span class="tooltip">
                    Cascading Style Sheets
                </span>
            </div>

            <!-- Tooltip 3 -->
            <div class="tooltip-box">
                Java

                <span class="tooltip">
                    Java Programming Language
                </span>
            </div>

            <!-- Tooltip 4 -->
            <div class="tooltip-box">
                Grid

                <span class="tooltip">
                    CSS Grid Layout
                </span>
            </div>

        </section>
    </main>

    <footer>
        <p>Tooltip Practice</p>
    </footer>

</body>
</html>
