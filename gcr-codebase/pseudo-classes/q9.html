<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Combined CSS Effects</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Combined CSS Effects</h1>
        <p>Hover over the buttons to see multiple effects</p>
    </header>

    <main>

        <section class="effects">

            <button class="effect-button">
                Hover Me
            </button>

            <button class="effect-button">
                Move Me
            </button>

            <button class="effect-button">
                Grow Me
            </button>

        </section>

    </main>

    <footer>
        <p>Combined Effects Practice</p>
    </footer>

</body>
</html>
