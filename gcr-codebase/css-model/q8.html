<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Model Exploration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>CSS Box Model</h1>
    </header>

    <main>

        <section class="box-model-section">

            <div class="margin-layer">

                <div class="border-layer">

                    <div class="padding-layer">

                        <div class="content-layer">
                            Content
                        </div>

                    </div>

                </div>

            </div>

            <div class="description">
                <h2>Box Model Layers</h2>
                <p><strong>Content:</strong> Actual text or element content.</p>
                <p><strong>Padding:</strong> Space around the content.</p>
                <p><strong>Border:</strong> Line surrounding padding.</p>
                <p><strong>Margin:</strong> Space outside the border.</p>
            </div>

        </section>

        <section class="comparison">

            <h2>Box Sizing Comparison</h2>

            <div class="comparison-box default-box">
                Default Box Sizing
            </div>

            <div class="comparison-box border-box">
                Border Box
            </div>

        </section>

    </main>

    <footer>
        <p>Box Model CSS Practice</p>
    </footer>

</body>
</html>
