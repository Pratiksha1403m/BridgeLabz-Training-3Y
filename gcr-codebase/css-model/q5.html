<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced CSS Selectors</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Advanced CSS Selectors</h1>
    </header>

    <main>

        <section class="selector-section">

            <h2>Items List</h2>

            <ul class="items">
                <li>HTML</li>
                <li>CSS</li>
                <li>JavaScript</li>
                <li>Java</li>
                <li>Python</li>
            </ul>

            <h2>Form</h2>

            <form>
                <input type="text" placeholder="Enter your name">

                <input type="email" placeholder="Enter your email">

                <button type="submit">Submit</button>
            </form>

            <p>
                Visit
                <a href="https://www.example.com">
                    Example Website
                </a>
            </p>

            <div class="parent">
                <p>Direct child paragraph</p>

                <div>
                    <p>Descendant paragraph</p>
                </div>
            </div>

            <p class="sibling-one">First sibling</p>
            <p class="sibling-two">Second sibling</p>
            <p class="sibling-three">Third sibling</p>

        </section>

    </main>

    <footer>
        <p>Advanced Selectors Practice</p>
    </footer>

</body>
</html>
