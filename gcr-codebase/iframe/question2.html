<!DOCTYPE html>
<html>
<head>
    <title>My City Map</title>
</head>
<body>

<h2>Google Map</h2>

<!-- loading="lazy" loads the map only when it is close to being visible -->
<iframe
    title="Google Map of Mathura"
    width="600"
    height="450"
    loading="lazy"
    src="https://www.google.com/maps?q=Mathura&output=embed">
</iframe>

</body>
</html>
