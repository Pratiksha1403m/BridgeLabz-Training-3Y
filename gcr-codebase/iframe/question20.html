<!DOCTYPE html>
<html>
<head>

    <!-- Sets the title shown on the browser tab -->
    <title>Important Head Elements</title>

    <!-- Defines character encoding -->
    <meta charset="UTF-8">

    <!-- Gives a short description of the webpage -->
    <meta name="description" content="A webpage demonstrating HTML head elements">

    <!-- Identifies the author of the webpage -->
    <meta name="author" content="Priyanshi">

    <!-- Sets the base URL for relative links -->
    <base href="https://example.com/">

    <!-- Links an external resource such as a favicon -->
    <link rel="icon" href="favicon.ico">

    <!-- CSS can be written inside this style element -->
    <style>
    </style>

    <!-- JavaScript can be written inside this script element -->
    <script>
    </script>

</head>

<body>

<h1>Important HTML Head Elements</h1>
<p>This page demonstrates different elements used inside the head.</p>

</body>
</html>
