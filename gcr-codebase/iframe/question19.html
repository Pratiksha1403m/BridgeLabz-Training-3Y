<!DOCTYPE html>
<html>
<head>
    <title>Form Security</title>
</head>
<body>

<h2>Secure Form</h2>

<form autocomplete="off">

    Name:
    <input type="text" name="name" required>
    <br><br>

    Email:
    <input type="email" name="email" required>
    <br><br>

    Password:
    <input type="password" name="password" required>
    <br><br>

    <input type="submit" value="Submit">

</form>

<p>
    Turning off autocomplete can reduce the chance of sensitive
    form information being automatically stored or suggested by
    the browser.
</p>

</body>
</html>
